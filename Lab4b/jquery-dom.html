<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 — jQuery vs Native JS</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .container { background: white; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
    /* Class WAJIB dari soalan */
    .myStyle { background-color: coral; padding: 16px; border-radius: 5px; transition: 0.3s; }
    
    div { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 5px; background: #fafafa; }
    button { background-color: #e74c3c; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #c0392b; }
  </style>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Question 3: jQuery vs Native JS</h1>
    
    <div id="myElement">Original Text</div>
    <div id="myDIV"><p>I am a myDIV.</p></div>
    <button id="myButton">Click me</button>
  </div>

  <script>
    $(document).ready(function () {
      $("#myElement").text("Modified Text");
      $("#myDIV").addClass("myStyle");
      $("#myButton").on("click", function () {
        alert("Button clicked!");
      });
    });
  </script>
</body>
</html>
