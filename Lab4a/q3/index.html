<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3 — Dynamic Number Generator</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .container { background: white; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
    button { background-color: #9b59b6; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
    button:hover { background-color: #8e44ad; }
    ol { background: #f9f9f9; padding: 20px 20px 20px 40px; border-radius: 5px; border: 1px solid #eee; }
    li { padding: 8px 0; font-size: 16px; border-bottom: 1px dashed #ddd; }
    li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Question 3: Dynamic Number Generator</h1>
    <button id="generateBtn" type="button">Generate Numbers</button>
    <ol id="numberList"></ol>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
