<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 — Interactive Text Changer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .container { background: white; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
    h1 { color: #2c3e50; font-size: 24px; }
    #message { font-size: 18px; margin: 20px 0; padding: 15px; background: #eef2f5; border-left: 5px solid #3498db; border-radius: 4px; }
    button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #2980b9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Question 1: Interactive Text Changer</h1>
    <div id="myElement">
      <p id="message">Welcome to my website!</p>
    </div>
    <button id="changeBtn" type="button">Change Message</button>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
